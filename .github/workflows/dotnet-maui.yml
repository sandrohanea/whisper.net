# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Dotnet Maui Build and Test
permissions:
  contents: read

on:
  workflow_call:

env:
  IOS_SIMULATOR_VERSION: "27.0"
  IOS_SIMULATOR_DEVICE: "iPhone 18 Pro"

jobs:
  dotnet-maui-build:
    runs-on: xcode-27

    env:
      USE_WHISPER_MAUI: "TRUE"
      USE_WHISPER_MAUI_TESTS: "TRUE"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "27.0"

      - name: Download Artifacts
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: runtimes

      - name: Install dotnet workloads
        run: |
          dotnet workload install maui --ignore-failed-sources
          dotnet workload install tvos --ignore-failed-sources

      - name: Restore dependencies
        run: dotnet restore ./Whisper.net.Maui.Tests.slnx

      - name: Install xharness
        run: dotnet tool install Microsoft.DotNet.XHarness.CLI --global --version "10.0.0-*"

      - name: Ensure simulator
        run: xharness apple simulators install "ios-simulator_${IOS_SIMULATOR_VERSION}"

      - name: Build ios-simulator
        run: dotnet build ./tests/Whisper.net.Tests.Maui/Whisper.net.Tests.Maui.csproj -c Debug -f net10.0-ios -r iossimulator-arm64 -p:EmbedAssembliesIntoAppBundle=true -p:CodesignKey="" -p:CodesignProvision=""

      - name: Build android
        run: dotnet build ./tests/Whisper.net.Tests.Maui/Whisper.net.Tests.Maui.csproj -c Debug -f net10.0-android -p:EmbedAssembliesIntoApk=true

      - name: Upload apk and ios app
        uses: actions/upload-artifact@v6
        with:
          name: maui-build-artifacts
          path: |
            ./tests/Whisper.net.Tests.Maui/bin/Debug/net10.0-ios/iossimulator-arm64/Whisper.net.Tests.Maui.app
            ./tests/Whisper.net.Tests.Maui/bin/Debug/net10.0-android/com.companyname.whisper.net.tests.maui-Signed.apk

  dotnet-maui-test-android:
    runs-on: ubuntu-latest
    needs: dotnet-maui-build

    env:
      USE_WHISPER_MAUI: "TRUE"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Download Artifacts
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          name: maui-build-artifacts
          path: maui-build-artifacts

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install xharness
        run: dotnet tool install Microsoft.DotNet.XHarness.CLI --global --version "10.0.0-*"

      - name: run android tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 29
          arch: x86_64
          script: xharness android test --app=./maui-build-artifacts/net10.0-android/com.companyname.whisper.net.tests.maui-Signed.apk -p com.companyname.whisper.net.tests.maui -i com.companyname.whisper.net.tests.maui.AndroidMauiTestInstrumentation -o=./test-results/android --timeout "00:30:00"

      - name: Upload Maui Android xharness test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: xharness-android-test-results
          path: |
            ./test-results/*

  dotnet-maui-test-ios:
    runs-on: xcode-27
    needs: dotnet-maui-build

    env:
      USE_WHISPER_MAUI: "TRUE"

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "27.0"

      - name: Download Artifacts
        id: download-artifact
        uses: actions/download-artifact@v7
        with:
          name: maui-build-artifacts
          path: maui-build-artifacts

      - name: Install xharness
        run: dotnet tool install Microsoft.DotNet.XHarness.CLI --global --version "10.0.0-*"

      - name: Ensure simulator
        run: xharness apple simulators install "ios-simulator_${IOS_SIMULATOR_VERSION}"

      - name: run ios tests
        timeout-minutes: 40
        shell: bash
        run: |
          # Boot normally before mlaunch installs the app; a cold mlaunch boot can hang.
          simulator_info=$(xcrun simctl list --json | python3 -c '
          import json, os, sys
          data = json.load(sys.stdin)
          version = os.environ["IOS_SIMULATOR_VERSION"]
          device_name = os.environ["IOS_SIMULATOR_DEVICE"]
          runtime_suffix = ".iOS-" + version.replace(".", "-")
          runtime = next((item for item in data["runtimes"]
                          if item.get("isAvailable") and item["identifier"].endswith(runtime_suffix)), None)
          if runtime is None:
              sys.exit("No available iOS " + version + " simulator runtime")
          device_type = next((item for item in data["devicetypes"] if item["name"] == device_name), None)
          if device_type is None:
              sys.exit("Xcode does not support simulator device " + device_name)
          simulator = next((device for device in data["devices"].get(runtime["identifier"], [])
                            if device.get("isAvailable") and device["name"] == device_name), None)
          print(simulator["udid"] if simulator else "create",
                simulator["state"] if simulator else "Shutdown",
                runtime["identifier"], device_type["identifier"])
          ')
          read -r simulator_id simulator_state runtime_id device_type_id <<< "$simulator_info"
          if [ "$simulator_id" = "create" ]; then
            simulator_id=$(xcrun simctl create "$IOS_SIMULATOR_DEVICE" "$device_type_id" "$runtime_id")
          fi
          if [ "$simulator_state" = "Shutdown" ]; then
            xcrun simctl boot "$simulator_id"
          fi
          mkdir -p ./test-results/ios
          xcrun simctl bootstatus "$simulator_id" -b | tee ./test-results/ios/simulator-boot.log
          xharness apple test --app=./maui-build-artifacts/net10.0-ios/iossimulator-arm64/Whisper.net.Tests.Maui.app --output-directory=./test-results/ios --target=ios-simulator-64 --device="$simulator_id" --timeout "00:30:00"
      - name: Upload Maui iOS xharness test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: xharness-ios-test-results
          path: |
            ./test-results/*
